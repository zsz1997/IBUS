
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>IBUS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 40px 20px;
            color: #253449;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        h1 {
            text-align: center;
            font-size: 28px;
        }

        p {
            text-align: center;
            line-height: 1.7;
            color: #596579;
        }

        video {
            width: 100%;
            border-radius: 8px;
            background: black;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>IBUS demo video</h1>

        <p>
            Interactive demo of the
            IBUS-assisted breast ultrasound
            diagnostic system.
        </p>

        <video controls preload="metadata">
            <source src="IBUS-assisted_demo_video.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>

        <footer>
            IBUS-assisted diagnostic workflow
        </footer>
    </div>
</body>
</html>
